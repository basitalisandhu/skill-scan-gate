name: "Skill Scan Gate"
description: "Gate Claude Code skills and plugins in CI: prompt injection, exfiltration, risky hooks, unpinned MCP, secrets."
author: "Muhammad Basit Ali (@basitalisandhu)"
branding:
  icon: shield
  color: purple

inputs:
  path:
    description: "Directory to scan, relative to the workspace (a skills repository, a plugin, or a marketplace)."
    required: false
    default: "."
  fail-on:
    description: "Lowest severity that fails the job: low, medium, high or none. Findings below it are still reported."
    required: false
    default: "high"
  baseline:
    description: "Baseline file written by `skill-scan-gate baseline`. Only findings not in it count towards the gate."
    required: false
    default: ""
  blob-min:
    description: "Minimum base64 run length for SSG203 (long encoded blob). The CLI default is 200 and the minimum is 64."
    required: false
    default: "200"
  changed-only:
    description: "On pull requests, report only findings in the files the pull request changes (true or false). Repository checks still run. Needs actions/checkout with fetch-depth 0."
    required: false
    default: "false"
  allow:
    description: "Allowlist file (see docs/false-positives.md). Protect it with CODEOWNERS."
    required: false
    default: ""
  exclude:
    description: "Path globs to skip, one per line, relative to path."
    required: false
    default: ""
  sarif:
    description: "Write a SARIF 2.1.0 report (true or false)."
    required: false
    default: "true"
  sarif-file:
    description: "Where to write the SARIF report."
    required: false
    default: "skill-scan-gate.sarif"
  upload-sarif:
    description: "Upload the SARIF report to GitHub code scanning (true or false). Needs permissions security-events write; only used when sarif is true."
    required: false
    default: "true"
  category:
    description: "Code scanning category for the upload, so several scans can coexist in one repository."
    required: false
    default: "skill-scan-gate"
  comment:
    description: "Post or update one sticky pull request comment with the counts, the gate result and the top 10 findings (true or false). Needs permissions pull-requests write; skipped with a notice on forks."
    required: false
    default: "false"
  github-token:
    description: "Token used to post the pull request comment. The default job token is enough when the job has pull-requests write."
    required: false
    default: ${{ github.token }}
  python-version:
    description: "Python version to install with actions/setup-python. Empty uses the python3 on the runner (3.11 or newer is required)."
    required: false
    default: ""

outputs:
  finding-count:
    description: "Findings after baseline and allowlist suppression, at every severity."
    value: ${{ steps.scan.outputs.finding-count }}
  highest-severity:
    description: "Highest severity found: high, medium, low or none."
    value: ${{ steps.scan.outputs.highest-severity }}
  gate:
    description: "pass or fail, according to fail-on."
    value: ${{ steps.scan.outputs.gate }}
  suppressed-count:
    description: "Findings suppressed by the baseline or the allowlist."
    value: ${{ steps.scan.outputs.suppressed-count }}
  sarif-file:
    description: "Path of the SARIF report, empty when sarif is false."
    value: ${{ steps.scan.outputs.sarif-file }}
  comment-file:
    description: "Path of the pull request comment body (Markdown), empty when comment is false."
    value: ${{ steps.scan.outputs.comment-file }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      if: ${{ inputs.python-version != '' }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Scan skills and plugins
      id: scan
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SCAN_PATH: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
        BASELINE: ${{ inputs.baseline }}
        BLOB_MIN: ${{ inputs.blob-min }}
        ALLOW: ${{ inputs.allow }}
        CHANGED_ONLY: ${{ inputs.changed-only }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        EXCLUDE: ${{ inputs.exclude }}
        SARIF: ${{ inputs.sarif }}
        SARIF_FILE: ${{ inputs.sarif-file }}
        UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        COMMENT: ${{ inputs.comment }}
        CATEGORY: ${{ inputs.category }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -uo pipefail
        if ! python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else 1)'; then
          echo "::error::skill-scan-gate needs Python 3.11 or newer; set the python-version input."
          exit 2
        fi
        # The scanner runs from the action's own checkout, so it is pinned to the ref in `uses:`.
        args=(scan "$SCAN_PATH" --fail-on "$FAIL_ON" --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT")
        if [ -n "$BASELINE" ]; then args+=(--baseline "$BASELINE"); fi
        if [ -n "$BLOB_MIN" ]; then args+=(--blob-min "$BLOB_MIN"); fi
        if [ -n "$ALLOW" ]; then args+=(--allow "$ALLOW"); fi
        if [ "$CHANGED_ONLY" = "true" ]; then
          if [ -n "$BASE_SHA" ]; then
            args+=(--changed-only "$BASE_SHA")
          else
            echo "::notice title=skill-scan-gate::changed-only applies to pull requests; this run reports every file."
          fi
        fi
        while IFS= read -r glob; do
          if [ -n "$glob" ]; then args+=(--exclude "$glob"); fi
        done <<< "$EXCLUDE"
        if [ "$SARIF" = "true" ]; then
          args+=(--sarif "$SARIF_FILE")
          echo "sarif-file=$SARIF_FILE" >> "$GITHUB_OUTPUT"
        else
          echo "sarif-file=" >> "$GITHUB_OUTPUT"
        fi
        if [ "$COMMENT" = "true" ]; then
          comment_file=$(mktemp "${RUNNER_TEMP:-/tmp}/skill-scan-gate-comment.XXXXXX")
          args+=(--comment "$comment_file" --comment-marker "$CATEGORY")
          args+=(--comment-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          if [ "$SARIF" = "true" ] && [ "$UPLOAD_SARIF" = "true" ] && [ -n "$PR_NUMBER" ]; then
            args+=(--comment-sarif-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/security/code-scanning?query=is%3Aopen+pr%3A$PR_NUMBER+tool%3Askill-scan-gate")
          fi
          echo "comment-file=$comment_file" >> "$GITHUB_OUTPUT"
        else
          echo "comment-file=" >> "$GITHUB_OUTPUT"
        fi
        set +e
        PYTHONPATH="$ACTION_PATH/src${PYTHONPATH:+:$PYTHONPATH}" python3 -m skill_scan_gate "${args[@]}"
        rc=$?
        set -e
        # 1 means the gate failed; the last step reports that after the SARIF upload. Anything else is an error.
        if [ "$rc" -gt 1 ]; then
          echo "::error::skill-scan-gate exited with $rc (bad path, baseline, allowlist or changed-only base)"
          exit "$rc"
        fi
        exit 0

    - name: Upload SARIF to code scanning
      if: ${{ !cancelled() && steps.scan.outcome == 'success' && inputs.sarif == 'true' && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: ${{ inputs.category }}

    - name: Comment on the pull request
      if: ${{ !cancelled() && steps.scan.outcome == 'success' && inputs.comment == 'true' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        BODY_FILE: ${{ steps.scan.outputs.comment-file }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        # Never fails the job: a missing permission or a fork only skips the comment with a notice.
        set -uo pipefail
        skip() { echo "::notice title=skill-scan-gate::$1 The results are in the job summary."; exit 0; }
        if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
          skip "Pull request from a fork: the token is read-only, so no comment was posted."
        fi
        command -v gh > /dev/null || skip "The gh CLI is not on this runner, so no comment was posted."
        [ -s "$BODY_FILE" ] || skip "No comment body was written."
        MARKER=$(head -n 1 "$BODY_FILE")
        export MARKER
        payload=$(mktemp "${RUNNER_TEMP:-/tmp}/skill-scan-gate-payload.XXXXXX")
        python3 -c 'import json, sys; json.dump({"body": open(sys.argv[1], encoding="utf-8").read()}, open(sys.argv[2], "w"))' "$BODY_FILE" "$payload"
        comments="repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
        if ! existing=$(gh api --paginate "$comments?per_page=100" --jq '.[] | select((.body // "") | startswith(env.MARKER)) | .id'); then
          skip "Could not list the pull request comments (the job needs pull-requests write)."
        fi
        id=$(printf '%s\n' "$existing" | head -n 1)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" --input "$payload" > /dev/null \
            || skip "Could not update the pull request comment (the job needs pull-requests write)."
          echo "Updated the skill-scan-gate comment on pull request #$PR_NUMBER."
        else
          gh api -X POST "$comments" --input "$payload" > /dev/null \
            || skip "Could not post the pull request comment (the job needs pull-requests write)."
          echo "Posted the skill-scan-gate comment on pull request #$PR_NUMBER."
        fi

    - name: Fail on findings at or above the threshold
      if: ${{ steps.scan.outputs.gate == 'fail' }}
      shell: bash
      env:
        COUNT: ${{ steps.scan.outputs.finding-count }}
        HIGHEST: ${{ steps.scan.outputs.highest-severity }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        echo "::error::skill-scan-gate: $COUNT finding(s), highest severity $HIGHEST, threshold $FAIL_ON. See the job summary or the Security tab."
        exit 1

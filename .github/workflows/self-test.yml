name: Action self-test

# Runs the composite Action from this checkout (uses: ./) against the repository's own fixtures:
#   - fixture-planted must fail the gate (non-zero exit) and still write SARIF with results;
#   - fixture-clean must pass with zero findings at the lowest threshold;
#   - a secret-shaped fixture, generated at run time and never committed, must fail;
#   - the planted fixture with a baseline of its own findings must pass.
#   - on pull requests, changed-only mode reports a subset of the planted findings and rejects an unknown ref;
#   - on pull requests, the planted fixture with comment: true must write a comment body with the counts,
#     the gate result, at most 10 findings, the hidden marker and no secret values; the body is asserted
#     from the file the Action writes, so the test does not depend on the comment being posted.
# SARIF upload is off here so planted findings never reach this repository's Security tab.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    name: Run the Action on the fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Planted fixture (gate must fail)
        id: planted
        uses: ./
        continue-on-error: true
        with:
          path: tests/fixtures/fixture-planted
          fail-on: high
          upload-sarif: "false"
          sarif-file: planted.sarif

      - name: Clean fixture (gate must pass at the lowest threshold)
        id: clean
        uses: ./
        with:
          path: tests/fixtures/fixture-clean
          fail-on: low
          upload-sarif: "false"
          sarif-file: clean.sarif

      - name: Build the secret-shaped fixture (generated, never committed)
        run: python3 tests/make_secret_fixture.py "$RUNNER_TEMP/fixture-secrets"

      - name: Secret-shaped fixture (gate must fail)
        id: secrets
        uses: ./
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/fixture-secrets
          fail-on: high
          blob-min: "120"
          upload-sarif: "false"
          sarif-file: secrets.sarif

      - name: Baseline the planted fixture
        run: PYTHONPATH=src python3 -m skill_scan_gate baseline tests/fixtures/fixture-planted --out "$RUNNER_TEMP/planted-baseline.json"

      - name: Planted fixture with its baseline (gate must pass)
        id: baselined
        uses: ./
        with:
          path: tests/fixtures/fixture-planted
          fail-on: low
          baseline: ${{ runner.temp }}/planted-baseline.json
          upload-sarif: "false"
          sarif-file: baselined.sarif

      - name: Check outcomes, outputs and SARIF
        env:
          PLANTED_OUTCOME: ${{ steps.planted.outcome }}
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
          CLEAN_COUNT: ${{ steps.clean.outputs.finding-count }}
          CLEAN_GATE: ${{ steps.clean.outputs.gate }}
          SECRETS_OUTCOME: ${{ steps.secrets.outcome }}
          BASELINED_OUTCOME: ${{ steps.baselined.outcome }}
          BASELINED_COUNT: ${{ steps.baselined.outputs.finding-count }}
          BASELINED_SUPPRESSED: ${{ steps.baselined.outputs.suppressed-count }}
        run: |
          set -eu
          test "$PLANTED_OUTCOME" = "failure"
          test "$CLEAN_OUTCOME" = "success"
          test "$CLEAN_COUNT" = "0"
          test "$CLEAN_GATE" = "pass"
          test "$SECRETS_OUTCOME" = "failure"
          test "$BASELINED_OUTCOME" = "success"
          test "$BASELINED_COUNT" = "0"
          test "$BASELINED_SUPPRESSED" -gt 0
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, "tests")
          from make_secret_fixture import tokens
          def load(p):
              d = json.load(open(p))
              assert d["version"] == "2.1.0", p
              return d["runs"][0]["results"]
          assert load("planted.sarif"), "planted SARIF has no results"
          assert load("clean.sarif") == [], "clean SARIF has results"
          assert load("baselined.sarif") == [], "baselined SARIF has results"
          secrets = open("secrets.sarif").read()
          assert json.loads(secrets)["runs"][0]["results"], "secrets SARIF has no results"
          # SSG501 evidence is the PEM "BEGIN ... PRIVATE KEY" marker by design (not key material),
          # as in tests/test_secrets.py; the key body must still never appear.
          leaked = [k for k, v in tokens().items() if k != "private_key_header" and v in secrets]
          assert "not-a-key" not in secrets, "private key body in SARIF"
          assert not leaked, f"unredacted values in SARIF: {leaked}"
          uris = {r["locations"][0]["physicalLocation"]["artifactLocation"]["uri"] for r in load("planted.sarif")}
          assert all(u.startswith("tests/fixtures/fixture-planted/") for u in uris), uris
          print("self-test checks passed")
          PY

      - name: CLI exit codes from the checkout
        run: |
          set +e
          PYTHONPATH=src python3 -m skill_scan_gate scan tests/fixtures/fixture-planted > /dev/null; test $? -eq 1 || exit 1
          PYTHONPATH=src python3 -m skill_scan_gate scan tests/fixtures/fixture-clean --fail-on low > /dev/null; test $? -eq 0 || exit 1
          PYTHONPATH=src python3 -m skill_scan_gate scan does-not-exist > /dev/null 2>&1; test $? -eq 2 || exit 1

  pr-comment:
    name: Pull request comment mode
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the secret-shaped fixture (generated, never committed)
        run: python3 tests/make_secret_fixture.py "$RUNNER_TEMP/fixture-secrets"

      - name: "Planted fixture with comment: true"
        id: planted
        uses: ./
        continue-on-error: true
        with:
          path: tests/fixtures/fixture-planted
          fail-on: high
          upload-sarif: "false"
          sarif-file: planted.sarif
          category: skill-scan-gate-self-test
          comment: "true"

      - name: "Secret-shaped fixture with comment: true (body only)"
        id: secrets
        uses: ./
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/fixture-secrets
          fail-on: high
          blob-min: "120"
          sarif: "false"
          category: skill-scan-gate-self-test-secrets
          comment: "true"
          github-token: ""

      - name: Check the comment bodies
        env:
          PLANTED_OUTCOME: ${{ steps.planted.outcome }}
          PLANTED_BODY: ${{ steps.planted.outputs.comment-file }}
          PLANTED_COUNT: ${{ steps.planted.outputs.finding-count }}
          SECRETS_OUTCOME: ${{ steps.secrets.outcome }}
          SECRETS_BODY: ${{ steps.secrets.outputs.comment-file }}
        run: |
          set -eu
          test "$PLANTED_OUTCOME" = "failure"
          test "$SECRETS_OUTCOME" = "failure"
          test -s "$PLANTED_BODY"
          test -s "$SECRETS_BODY"
          python3 - <<'PY'
          import os, re, sys
          sys.path.insert(0, "tests")
          from make_secret_fixture import tokens
          body = open(os.environ["PLANTED_BODY"], encoding="utf-8").read()
          lines = body.splitlines()
          assert lines[0] == "<!-- skill-scan-gate:comment skill-scan-gate-self-test -->", lines[0]
          assert "### skill-scan-gate: gate failed" in body
          count = int(os.environ["PLANTED_COUNT"])
          assert f"{count} finding(s)" in body, "count missing"
          assert re.search(r"^\| \d+ \| \d+ \| \d+ \| 0 \| fail \|$", body, re.M), "summary row missing"
          rows = [l for l in lines if re.match(r"^\| (high|medium|low) \| \[SSG\d{3}\]", l)]
          assert len(rows) == min(10, count), len(rows)
          assert rows[0].startswith("| high |"), rows[0]
          assert all(re.search(r"`[^`]+:\d+`", r) for r in rows), "location missing"
          assert "/actions/runs/" in body, "run link missing"
          assert "code-scanning" not in body, "SARIF link without an upload"
          secrets = open(os.environ["SECRETS_BODY"], encoding="utf-8").read()
          leaked = [k for k, v in tokens().items() if v in secrets]
          assert not leaked, f"secret values in the comment: {leaked}"
          assert "not-a-key" not in secrets and "redacted" not in secrets, "evidence in the comment"
          print("comment checks passed")
          PY

      - name: Check the sticky comment (same-repository pull requests only)
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          n=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            --jq '[.[] | select((.body // "") | startswith("<!-- skill-scan-gate:comment skill-scan-gate-self-test -->"))] | length' \
            | awk '{s += $1} END {print s + 0}')
          echo "sticky comments: $n"
          if [ "$n" -ne 1 ]; then
            echo "::warning::expected exactly one sticky comment, found $n (posting may have been refused)"
          fi

  changed-only:
    name: Changed-only mode
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Planted fixture, every file
        id: all
        uses: ./
        with:
          path: tests/fixtures/fixture-planted
          fail-on: none
          upload-sarif: "false"
          sarif-file: all.sarif

      - name: Planted fixture, only the files this pull request changes
        id: changed
        uses: ./
        with:
          path: tests/fixtures/fixture-planted
          fail-on: none
          changed-only: "true"
          upload-sarif: "false"
          sarif-file: changed.sarif

      - name: Check that changed-only reports a subset
        env:
          ALL_COUNT: ${{ steps.all.outputs.finding-count }}
          CHANGED_COUNT: ${{ steps.changed.outputs.finding-count }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          echo "every file: $ALL_COUNT, changed only: $CHANGED_COUNT"
          test "$CHANGED_COUNT" -le "$ALL_COUNT"
          PYTHONPATH=src python3 -m skill_scan_gate scan tests/fixtures/fixture-planted --changed-only "$BASE_SHA" --fail-on none | grep -q "note: changed-only:"
          set +e
          PYTHONPATH=src python3 -m skill_scan_gate scan tests/fixtures/fixture-planted --changed-only no-such-ref > /dev/null 2>&1; test $? -eq 2 || exit 1
